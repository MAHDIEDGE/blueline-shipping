<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Line Shipping — Révélation du logo</title>
<meta name="description" content="Animation de révélation du logo Blue Line Shipping (concept 05, Ligne de charge).">
<style>
  :root { --bg: #0B2F6E; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .controls {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px;
    width: max-content; max-width: calc(100% - 32px); box-sizing: border-box; padding: 8px 10px; border-radius: 12px;
    background: rgba(7, 26, 62, .9); color: #fff; font: 13px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .controls button {
    font: inherit; color: #fff; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .28);
    border-radius: 8px; padding: 8px 12px; min-height: 36px; cursor: pointer;
  }
  .controls button:hover { background: rgba(255, 255, 255, .22); }
  .controls button:focus-visible, .controls input:focus-visible { outline: 2px solid #FF6A33; outline-offset: 2px; }
  .controls input[type=range] { width: min(320px, 40vw); accent-color: #FF6A33; }
  .controls output { min-width: 4.2em; text-align: right; font-variant-numeric: tabular-nums; }
  body.export .controls { display: none; }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stage-title" preserveAspectRatio="xMidYMid meet">
  <title id="stage-title">Animation : la marque de ligne de charge d'un cargo devient le logo Blue Line Shipping</title>
  <desc>Version claire par défaut (fond Écume constant) ; ?theme=dark : fond sombre (Bleu Coque → Marine nuit) ; ?ending=container : fin sur un conteneur.</desc>
  <defs>
    <clipPath id="clip-sea"><rect id="sea-rect" x="0" y="0" width="0" height="0"/></clipPath>
    <clipPath id="clip-upper"><rect id="upper-rect" x="0" y="0" width="0" height="0"/></clipPath>
    <clipPath id="clip-lower"><rect id="lower-rect" x="0" y="0" width="0" height="0"/></clipPath>
    <clipPath id="clip-title"><rect id="title-rect" x="0" y="0" width="0" height="0"/></clipPath>
    <clipPath id="clip-tagline"><rect id="tagline-rect" x="0" y="0" width="0" height="0"/></clipPath>
  </defs>
  <rect id="bg" x="0" y="0" width="0" height="0"/>
  <g id="anim">
    <!-- Le cargo : tout ce qui passe sous l'horizon est masqué par la mer -->
    <g clip-path="url(#clip-sea)">
      <g id="hull" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path id="hull-outline" pathLength="1"/>
        <path id="hull-house" pathLength="1"/>
        <path id="hull-wing" pathLength="1"/>
        <path id="hull-cargo" pathLength="1"/>
        <g id="hull-bays"></g>
      </g>
    </g>
    <!-- La marque de Plimsoll, qui devient l'anneau du logo -->
    <g id="mark">
      <g clip-path="url(#clip-upper)"><path id="ring-upper" fill-rule="evenodd"/></g>
      <g clip-path="url(#clip-lower)"><path id="ring-lower" fill-rule="evenodd"/></g>
      <g clip-path="url(#clip-sea)"><rect id="mark-bar"/></g>
    </g>
    <!-- L'horizon, qui devient la ligne du logo -->
    <rect id="horizon"/>
    <circle id="pulse" fill="none"/>
    <!-- Le nom, lettre par lettre (tracés du SVG final) -->
    <g id="words">
      <g clip-path="url(#clip-title)" id="title"></g>
      <g clip-path="url(#clip-tagline)" id="tagline"></g>
    </g>
  </g>
  <!-- Fin alternative : le conteneur dont le flanc porte le logo (version sombre, ?ending=container) -->
  <g id="container" style="display:none"></g>
  <!-- Image finale : les tracés de logo-horizontal(-reverse).svg, sans aucune transformation propre -->
  <g id="final">
    <path id="final-ring"/>
    <path id="final-title"/>
    <path id="final-tagline"/>
    <path id="final-line"/>
  </g>
</svg>

<div class="controls" role="group" aria-label="Contrôles de l'animation">
  <button id="btn-play" type="button">Pause</button>
  <input id="scrub" type="range" min="0" max="8" step="0.0166667" value="0" aria-label="Position dans l'animation">
  <output id="clock" for="scrub">0,00 s</output>
  <button id="btn-theme" type="button">Fond sombre</button>
  <button id="btn-ending" type="button">Fin : conteneur</button>
  <button id="btn-format" type="button">Format 1:1</button>
</div>

  trim:     [3.10, 4.20],   // l'horizon se resserre sur l'anneau
  reveal:   [3.30, 3.90],   // la moitié immergée de l'anneau se révèle…
  split:    [3.30, 4.30],   // …déjà séparée de la ligne : deux demi-anneaux, jamais un anneau fermé sous la ligne
  extend:   [4.50, 5.50],   // la ligne file vers la droite
  title:    { start: 5.50, stagger: 0.065, dur: 0.55 },  // BLUE LINE
  tagline:  { start: 6.15, stagger: 0.045, dur: 0.50 },  // SHIPPING
  final: 7.00,              // image finale figée
  // fin conteneur : recul de la caméra, apparition des lignes du conteneur (même bleu que le fond), tenue 1 s
  container: { pull: [8.00, 9.80], appear: [8.05, 9.10], corrugation: [8.20, 9.30], end: 10.80 },
};

// Le cargo, en unités locales (longueur 1000, y = 0 à la ligne de charge, y < 0 vers le haut)
const HULL = {
  mark: { x: 480, r: 18 },  // centre et rayon de la marque de Plimsoll
  lift: 30,                 // la ligne de charge flotte 30 unités au-dessus de l'eau avant de s'enfoncer
  // tracé ouvert, de la poupe à la proue : il se dessine sur la partie émergée (la quille reste sous l'eau)
  outline: 'M4 48L0 -122L858 -122L872 -150L1000 -150L958 -20C946 10 930 34 900 52',
  house: 'M40 -122L40 -292L150 -292L150 -122',
  wing: 'M24 -262L166 -262',
  cargo: 'M176 -122L176 -226L832 -226L832 -122',
  bays: [258, 340, 422, 504, 586, 668, 750],
};

// --------------------------------------------------------------------------
// Courbes d'accélération (équivalents cubic-bezier CSS, aucune ne dépasse 1 : pas de rebond)
// --------------------------------------------------------------------------
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t;
  const sy = (t) => ((ay * t + by) * t + cy) * t;
  const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) {
      const e = sx(t) - x;
      if (Math.abs(e) < 1e-7) return sy(t);
      const d = dx(t);
      if (Math.abs(d) < 1e-6) break;
      t -= e / d;
    }
    let lo = 0, hi = 1;
    t = x;
    for (let i = 0; i < 50; i++) {
      const v = sx(t);
      if (Math.abs(v - x) < 1e-7) break;
      if (v < x) lo = t; else hi = t;
      t = (lo + hi) / 2;
    }
    return sy(t);
  };
}
const EASE = {
  inOut:  bezier(0.65, 0, 0.35, 1),   // transitions principales
  settle: bezier(0.40, 0, 0.70, 0.85),// enfoncement : départ souple, arrivée encore en mouvement → arrêt net, sans dépassement
  out:    bezier(0.22, 1, 0.36, 1),   // arrivée douce des lettres
  fade:   bezier(0.37, 0, 0.63, 1),   // fondus
  night:  bezier(0.80, 0, 0.50, 1),   // version sombre : 11 % sur 0–2 s, pic de vitesse à 3,5 s, arrivée à 5,4 s
};
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const seg = (t, [a, b]) => clamp01((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;

// --------------------------------------------------------------------------
// Couleurs : interpolation OKLCH (pas de gris terne à mi-parcours), contraste WCAG
// --------------------------------------------------------------------------
const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rgbHex = (c) => '#' + c.map((v) => Math.round(Math.min(255, Math.max(0, v))).toString(16).padStart(2, '0')).join('').toUpperCase();
const toLin = (v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
const toSrgb = (v) => { v = Math.min(1, Math.max(0, v)); return 255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055); };
function oklch(hex) {
  const [r, g, b] = hexRgb(hex).map(toLin);
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  const L = 0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s;
  const A = 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s;
  const B = 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s;
  return [L, Math.hypot(A, B), (Math.atan2(B, A) * 180 / Math.PI + 360) % 360];
}
function fromOklch(L, C, h) {
  const A = C * Math.cos(h * Math.PI / 180), B = C * Math.sin(h * Math.PI / 180);
  const l = (L + 0.3963377774 * A + 0.2158037573 * B) ** 3;
  const m = (L - 0.1055613458 * A - 0.0638541728 * B) ** 3;
  const s = (L - 0.0894841775 * A - 1.2914855480 * B) ** 3;
  return rgbHex([
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s,
  ].map(toSrgb));
}
function mixOklch(a, b, u) {
  if (u <= 0) return a;
  if (u >= 1) return b;
  const [L0, C0, h0] = oklch(a), [L1, C1, h1] = oklch(b);
  const dh = ((h1 - h0 + 540) % 360) - 180;          // teinte : plus court chemin
  return fromOklch(lerp(L0, L1, u), lerp(C0, C1, u), h0 + dh * u);
}
const lum = (hex) => { const [r, g, b] = hexRgb(hex).map(toLin); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const contrast = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };

// --------------------------------------------------------------------------
// Mise en page
// --------------------------------------------------------------------------
const params = new URLSearchParams(location.search);
const state = {
  theme: params.get('theme') === 'dark' ? 'dark' : 'light',
  ending: params.get('ending') === 'container' ? 'container' : 'logo',
  format: FORMATS[params.get('format')] ? params.get('format') : '16x9',
  exportMode: params.has('export'),
  playing: !params.has('export'),
  t: Math.max(0, parseFloat(params.get('t')) || 0),
};
// la fin conteneur n'existe qu'en version sombre : la tôle Marine nuit prolonge le fond final
const containerOn = () => state.theme === 'dark' && state.ending === 'container';
const duration = () => (containerOn() ? TL.container.end : LOGO_END);
if (state.exportMode) document.body.classList.add('export');

const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const set = (el, attrs) => { for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };
const n2 = (v) => Math.round(v * 1000) / 1000;

let L = null;          // mise en page courante
let titleEls = [], taglineEls = [];

// Couleurs : exactement celles des deux SVG du logo, plus Écume et Marine nuit pour les fonds
const COL = {
  navy: GEO.colors.light.fg, accentLight: GEO.colors.light.accent,      // logo-horizontal.svg
  white: GEO.colors.dark.fg, accentDark: GEO.colors.dark.accent,        // logo-horizontal-reverse.svg
  coque: GEO.colors.dark.bg, marine: MARINE,
};

// Fond : constant en version claire ; Bleu Coque → Marine nuit (OKLCH) en version sombre
function bgAt(t) {
  return state.theme === 'dark' ? mixOklch(COL.coque, COL.marine, EASE.night(seg(t, TL.night))) : DAY;
}
const fgAt = () => (state.theme === 'dark' ? COL.white : COL.navy);
const accentAt = () => (state.theme === 'dark' ? COL.accentDark : COL.accentLight);

function layout() {
  const F = FORMATS[state.format];
  const C = { bg: state.theme === 'dark' ? COL.marine : DAY, fg: fgAt(), accent: accentAt() };   // état final
  const [vbW, vbH] = GEO.vb;
  const k = F.logo * F.W / vbW;                        // px par unité du SVG final
  const X0 = Math.round((F.W - k * vbW) / 2);
  const Y0 = Math.round((F.H - k * vbH) / 2);
  const Hc = Y0 + k * GEO.ring.cy;                     // horizon = axe de la ligne du logo
  const u0 = F.hull * F.W / 1000;                      // px par unité du cargo (plan large)
  const stroke = 0.003 * F.H;                          // épaisseur des traits du plan large
  const rMark = HULL.mark.r * u0;
  const Rf = k * GEO.ring.R;
  return {
    F, C, k, X0, Y0, Hc, u0, stroke,
    xMark0: F.W / 2,                                   // la marque est au centre du plan large
    xRing: X0 + k * GEO.ring.cx,                       // centre final de l'anneau
    Rf, rRatio: GEO.ring.r / GEO.ring.R,
    Z: Rf / rMark,                                     // facteur de zoom de la caméra
    barF: k * (GEO.line.y1 - GEO.line.y0),             // épaisseur finale de la ligne
    cutF: k * GEO.ring.ycut,                           // demi-hauteur finale de la coupe
    lineEnd: X0 + k * GEO.line.x1,                     // extrémité droite finale de la ligne
  };
}

function setup() {
  L = layout();
  const { F, C } = L;
  document.documentElement.style.setProperty('--bg', C.bg);
  set($('stage'), { viewBox: `0 0 ${F.W} ${F.H}` });
  set($('bg'), { width: F.W, height: F.H });
  set($('sea-rect'), { x: -10, y: -10, width: F.W + 20, height: L.Hc + 10 });

  // Cargo
  set($('hull'), { 'stroke-width': n2(L.stroke / L.u0) });
  set($('hull-outline'), { d: HULL.outline });
  set($('hull-house'), { d: HULL.house });
  set($('hull-wing'), { d: HULL.wing });
  set($('hull-cargo'), { d: HULL.cargo });
  const bays = $('hull-bays');
  bays.replaceChildren();
  HULL.bays.forEach((x) => bays.appendChild(set(document.createElementNS(NS, 'path'), { d: `M${x} -226L${x} -122`, pathLength: 1 })));

  // Horizon et pulse : l'orange ne change jamais
  set($('horizon'), { fill: C.accent });
  set($('pulse'), { stroke: C.accent });

  // Lettres : tracés du SVG final, dans le repère du SVG final
  const tf = `translate(${L.X0} ${L.Y0}) scale(${L.k})`;
  set($('words'), { transform: tf });
  const build = (host, line) => host.replaceChildren(...line.glyphs.map((g) => set(document.createElementNS(NS, 'path'), { d: g.d })));
  build($('title'), GEO.title);
  build($('tagline'), GEO.tagline);
  titleEls = [...$('title').children];
  taglineEls = [...$('tagline').children];
  const clipLine = (rect, line) => set(rect, { x: -100, y: -100, width: GEO.vb[0] + 200, height: line.max_bottom + 100 + 0.01 * line.cap });
  clipLine($('title-rect'), GEO.title);
  clipLine($('tagline-rect'), GEO.tagline);

  // Image finale
  set($('final'), { transform: tf });
  set($('final-ring'), { d: GEO.full.ring, fill: C.fg });
  set($('final-title'), { d: GEO.full.title, fill: C.fg });
  set($('final-tagline'), { d: GEO.full.tagline, fill: C.fg });
  set($('final-line'), { d: GEO.full.line, fill: C.accent });

  // Conteneur (repère du logo) : une couche par élément, la tôle ondulée à part pour son fondu
  $('container').replaceChildren(...CONTAINER.layers.map((ly) =>
    set(document.createElementNS(NS, 'path'), { d: ly.d, fill: ly.fill, 'data-role': ly.role })));
  L.tf = tf;

  $('btn-theme').textContent = state.theme === 'dark' ? 'Fond clair' : 'Fond sombre';
  $('btn-ending').hidden = state.theme !== 'dark';
  $('btn-ending').textContent = state.ending === 'container' ? 'Fin : logo seul' : 'Fin : conteneur';
  $('btn-format').textContent = state.format === '16x9' ? 'Format 1:1' : 'Format 16:9';
  $('scrub').max = duration();
}

// Caméra de la fin conteneur : du cadrage du logo (e = 0) au conteneur entier centré (e = 1)
function containerCamera(e) {
  const { F, k, X0, Y0 } = L;
  const [bx0, by0, bx1, by1] = CONTAINER.box;
  const { width, center_y } = CONTAINER.framing;
  const s1 = width * F.W / (bx1 - bx0);
  const s = k * Math.pow(s1 / k, e);                 // recul exponentiel : vitesse perçue constante
  // point du monde placé au centre de l'image : le centre du cadrage du logo, puis celui du conteneur recadré
  const c0 = [(F.W / 2 - X0) / k, (F.H / 2 - Y0) / k];
  const c1 = [(bx0 + bx1) / 2, (by0 + by1) / 2 - (center_y - 0.5) * F.H / s1];
  const cx = lerp(c0[0], c1[0], e), cy = lerp(c0[1], c1[1], e);
  return { s, tx: F.W / 2 - cx * s, ty: F.H / 2 - cy * s };
}

// --------------------------------------------------------------------------
// Rendu d'une image à l'instant t (déterministe : sert à la lecture et à l'export)
// --------------------------------------------------------------------------
function annulus(cx, cy, R, r) {
  return `M${n2(cx + R)} ${n2(cy)}A${n2(R)} ${n2(R)} 0 1 0 ${n2(cx - R)} ${n2(cy)}A${n2(R)} ${n2(R)} 0 1 0 ${n2(cx + R)} ${n2(cy)}Z`
       + `M${n2(cx + r)} ${n2(cy)}A${n2(r)} ${n2(r)} 0 1 0 ${n2(cx - r)} ${n2(cy)}A${n2(r)} ${n2(r)} 0 1 0 ${n2(cx + r)} ${n2(cy)}Z`;
}

function markOpacity(t) {
  // apparition puis deux clignotements
  const [a] = TL.markIn;
  const keys = [[a, 0], [a + 0.06, 1], [a + 0.12, 1], [a + 0.17, 0.15], [a + 0.24, 1], [a + 0.32, 1], [a + 0.37, 0.15], [a + 0.44, 1]];
  if (t <= keys[0][0]) return 0;
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
      return lerp(v0, v1, EASE.fade((t - t0) / (t1 - t0)));
    }
  }
  return 1;
}

function renderAt(tIn, contentOpacity = 1, bgOverride = null) {
  const t = Math.max(0, Math.min(duration(), tIn));
  const { F, Hc, u0, stroke } = L;
  const scene = containerOn() && t > LOGO_END;       // après le logo figé : le conteneur
  const bg = bgOverride || (scene ? CONTAINER.colors.sky : bgAt(t));
  const fg = fgAt(t);
  $('bg').setAttribute('fill', bg);
  document.documentElement.style.setProperty('--bg', bg);
  for (const id of ['ring-upper', 'ring-lower', 'mark-bar', 'words']) $(id).setAttribute('fill', fg);
  $('hull').setAttribute('stroke', fg);
  const isFinal = t >= TL.final;
  $('anim').style.display = isFinal ? 'none' : '';
  $('final').style.display = isFinal ? '' : 'none';
  $('container').style.display = scene ? '' : 'none';
  for (const id of ['anim', 'final']) $(id).style.opacity = contentOpacity;
  if (scene) {
    const cam = containerCamera(EASE.inOut(seg(t, TL.container.pull)));
    const tf = `translate(${cam.tx} ${cam.ty}) scale(${cam.s})`;
    $('container').setAttribute('transform', tf);
    $('final').setAttribute('transform', tf);
    // la tôle a la couleur du fond : seules ses lignes, plus claires, apparaissent pendant le recul
    $('container').style.opacity = contentOpacity * EASE.fade(seg(t, TL.container.appear));
    const corr = n2(EASE.fade(seg(t, TL.container.corrugation)));
    for (const el of $('container').querySelectorAll('[data-role="corrugation"]')) el.setAttribute('opacity', corr);
    return;
  }
  $('final').setAttribute('transform', L.tf);       // exactement la transformation du logo seul
  if (isFinal) return;

  // Caméra : plan large → gros plan sur la marque (zoom exponentiel, translation sur l'horizon)
  const z = EASE.inOut(seg(t, TL.zoom));
  const s = Math.pow(L.Z, z);
  const cx = lerp(L.xMark0, L.xRing, z);
  const lift = HULL.lift * u0 * (1 - EASE.settle(seg(t, TL.sink)));
  const cy = Hc - lift;
  const R = HULL.mark.r * u0 * s;
  const r = R * L.rRatio;

  // Cargo
  const hullOn = t >= TL.hullDraw[0] && t < TL.hullFade[1];
  $('hull').style.display = hullOn ? '' : 'none';
  if (hullOn) {
    set($('hull'), {
      transform: `translate(${n2(cx)} ${n2(cy)}) scale(${(u0 * s).toFixed(5)}) translate(${-HULL.mark.x} 0)`,
      opacity: n2(1 - EASE.fade(seg(t, TL.hullFade))),
    });
    const draw = (el, span) => set(el, { 'stroke-dasharray': '1 1', 'stroke-dashoffset': n2(1 - EASE.inOut(seg(t, span))) });
    draw($('hull-outline'), TL.hullDraw);
    draw($('hull-house'), TL.houseDraw);
    draw($('hull-wing'), [TL.houseDraw[0] + 0.15, TL.houseDraw[1]]);
    draw($('hull-cargo'), TL.cargoDraw);
    [...$('hull-bays').children].forEach((el, i) => draw(el, [TL.cargoDraw[0] + 0.10 + i * 0.025, TL.cargoDraw[1] - 0.03 + i * 0.005]));
  }

  // Ligne : horizon pendant le plan large, ligne du logo à la fin
  const hOpen = EASE.inOut(seg(t, TL.horizon));
  const trim = EASE.inOut(seg(t, TL.trim));
  const ext = EASE.inOut(seg(t, TL.extend));
  const th = lerp(stroke, L.barF, z);
  const half = (F.W / 2) * hOpen;
  let xL = lerp(F.W / 2 - half, cx - R, trim);
  let xR = lerp(F.W / 2 + half, cx + R, trim);
  if (t >= TL.extend[0]) { xL = L.X0; xR = lerp(L.xRing + L.Rf, L.lineEnd, ext); }
  const lineOn = t >= TL.horizon[0];
  $('horizon').style.display = lineOn ? '' : 'none';
  if (lineOn) set($('horizon'), { x: n2(xL), y: n2(Hc - th / 2), width: n2(Math.max(0, xR - xL)), height: n2(th) });

  // Marque de Plimsoll → anneau
  const markOn = t >= TL.markIn[0];
  $('mark').style.display = markOn ? '' : 'none';
  if (markOn) {
    const op = t < TL.zoom[0] ? markOpacity(t) : 1;
    set($('mark'), { opacity: n2(op) });
    // la coupe dépasse toujours la demi-épaisseur de la ligne : la moitié basse n'apparaît jamais collée à la ligne
    const cut = th / 2 + (L.cutF - L.barF / 2) * EASE.inOut(seg(t, TL.split));
    const reveal = EASE.inOut(seg(t, TL.reveal)) * (R + 4 * stroke);
    const d = annulus(cx, cy, R, r);
    set($('ring-upper'), { d });
    set($('ring-lower'), { d });
    set($('upper-rect'), { x: -10, y: -10, width: F.W + 20, height: n2(Math.max(0, cy - cut + 10)) });
    const lowTop = cy + cut;
    set($('lower-rect'), { x: -10, y: n2(lowTop), width: F.W + 20, height: n2(Math.max(0, Hc + reveal - lowTop)) });
    const barOn = t < TL.sink[1];
    $('mark-bar').style.display = barOn ? '' : 'none';
    if (barOn) set($('mark-bar'), { x: n2(cx - 1.45 * R), y: n2(cy - stroke / 2), width: n2(2.9 * R), height: n2(stroke) });
  }

  // Micro-pulse orange au moment où la ligne de charge touche l'eau
  const pOn = t >= TL.pulse[0] && t < TL.pulse[1];
  $('pulse').style.display = pOn ? '' : 'none';
  if (pOn) {
    const p = seg(t, TL.pulse);
    const grow = EASE.inOut(p);
    const fade = EASE.fade(clamp01((p - 0.24) / 0.76));       // tenu ≈ 0,12 s, puis s'éteint
    set($('pulse'), { cx: n2(cx), cy: n2(cy), r: n2(R * (1.3 + 1.3 * grow)), 'stroke-width': n2(1.6 * stroke), opacity: n2(0.9 * (1 - fade)) });
  }

  // Le nom : chaque lettre émerge de sous sa ligne de base
  const letters = (els, line, cfg) => els.forEach((el, i) => {
    const a = cfg.start + i * cfg.stagger;
    const p = seg(t, [a, a + cfg.dur]);
    const e = EASE.out(p);
    el.style.display = p > 0 ? '' : 'none';
    set(el, { transform: `translate(0 ${n2((1 - e) * 0.9 * line.cap)})`, opacity: n2(EASE.fade(clamp01(p / 0.6))) });
  });
  letters(titleEls, GEO.title, TL.title);
  letters(taglineEls, GEO.tagline, TL.tagline);
}

// --------------------------------------------------------------------------
// Lecture (boucle) et contrôles
// --------------------------------------------------------------------------
const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmtClock = (t) => `${t.toFixed(2).replace('.', ',')} s`;
let origin = null;

function frame(now) {
  if (!state.playing) return;
  if (origin === null) origin = now - state.t * 1000;
  const D = duration();
  const cycle = D + LOOP_HOLD + LOOP_FADE;
  const tc = ((now - origin) / 1000) % cycle;
  state.t = Math.min(tc, D);
  if (tc > D + LOOP_HOLD) renderTail((tc - D - LOOP_HOLD) / LOOP_FADE);
  else renderAt(state.t);
  $('scrub').value = state.t;
  $('clock').value = fmtClock(state.t);
  requestAnimationFrame(frame);
}

// Retour au début de la boucle : le logo (ou le conteneur) s'efface ; en version sombre, le fond revient de
// Marine nuit au Bleu Coque de départ ; en version claire, il reste Écume
function renderTail(u) {
  const e = EASE.fade(clamp01(u));
  renderAt(duration(), 1 - e, state.theme === 'dark' ? mixOklch(COL.marine, COL.coque, e) : DAY);
}

function play(on) {
  state.playing = on;
  $('btn-play').textContent = on ? 'Pause' : 'Lecture';
  if (on) { origin = null; if (state.t >= duration()) state.t = 0; requestAnimationFrame(frame); }
}

$('btn-play').addEventListener('click', () => play(!state.playing));
$('scrub').addEventListener('input', (e) => {
  play(false);
  state.t = parseFloat(e.target.value);
  renderAt(state.t);
  $('clock').value = fmtClock(state.t);
});
$('btn-theme').addEventListener('click', () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; setup(); renderAt(state.t); });
$('btn-ending').addEventListener('click', () => { state.ending = state.ending === 'container' ? 'logo' : 'container'; setup(); renderAt(state.t); });
$('btn-format').addEventListener('click', () => { state.format = state.format === '16x9' ? '1x1' : '16x9'; setup(); renderAt(state.t); });

// API pour l'export image par image (tools/render.js)
window.BLS = {
  FPS, TL, LOGO_END,
  get DURATION() { return duration(); },
  renderAt: (t) => renderAt(t),
  renderTail: (u) => renderTail(u),
  colorsAt: (t) => ({ bg: containerOn() && t > LOGO_END ? null : bgAt(t), fg: fgAt(), accent: accentAt() }),
  container: () => CONTAINER,
  layout: () => ({ ...L, F: { ...L.F }, C: { ...L.C }, vb: GEO.vb }),
};

setup();
state.t = Math.min(state.t, duration());
if (reduced && !state.exportMode && !params.has('t')) state.t = duration();
renderAt(state.t);
$('scrub').value = state.t;
$('clock').value = fmtClock(state.t);
if (state.playing && !reduced && !params.has('t')) play(true); else play(false);
})();
</script>
</body>
</html>
